name: Denky D4 (Tasmota)
platform: tasmota
status: beta
url: https://github.com/hallard/Denky-D4
# Denky D4 runs the Tasmota Teleinfo driver (xnrg_15_teleinfo) on a Linky meter.
# Tasmota publishes one sensor per teleinfo label, so entity ids end with the
# label name: sensor.<device>_papp, _sinsts, _east, _eait, _hchc, _hchp, _base.
# SINSTS is the signed apparent power (import > 0, export < 0), PAPP is unsigned:
# SINSTS is matched first and PAPP is the fallback for meters that only send PAPP.
match_device: ['denky', 'teleinfo', 'linky', 'papp', 'sinsts', 'east', 'eait']
roles:
  grid_power: ['_sinsts$', '_papp$']
  grid_import_energy: ['_east$', '_hchc$', '_base$']
  grid_export_energy: ['_eait$']
signs:
  grid_power: import_positive
capabilities:
  tempo: absent
